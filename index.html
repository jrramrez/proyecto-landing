<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WestGrit</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
    <main>

        <section class="hero">
            <div class="container hero-grid">
                <div class="hero-text">
                    <P class="eyebrow">Built in dust</P>
                    <h1>Más que un proyecto, un estilo de vida.</h1>
                    <p class="hero-description">¡Sigue el proceso de modificación!</p>
                </div>

            </div>
        </section>

        <section class="section" id="gear">
            <div class="section-header">
                <h2>My gear</h2>
            </div>

            <div class="categories">
                
                <!-- Categoría 1 -->
                <div class="category" style="background-image: url('img/LP\ 1.1.png');">
                    Suspensión
                </div>

                <!-- Categoría 2 -->
                <div class="category" style="background-image: url('img/LP\ 2.2.png');">
                    Llantas
                </div>

                <!-- Categoría 3 -->
                <div class="category" style="background-image: url('img/LP\ 3.3.png');">
                    Frontline
                </div>

                <!-- Categoría 4 -->
                <div class="category" style="background-image: url('img/LP\ 4.4.png');">
                    Backline
                </div>

                <!-- Categoría 5 -->
                <div class="category" style="background-image: url('img/LP\ 5.5.png');">
                    Accesorios
                </div>

                <!-- Categoría 6 -->
                <div class="category" style="background-image: url('img/LP\ 6.6.png');">
                    Extras
                </div>

            </div>
        </section>

        <section class="collabs" id="contact-us">
            <div class="section-contact">
                <h3>Contacto para colaboraciones</h3>
                <a href="https://www.instagram.com/west.grit" class="btn btn-primary">Let's create</a>
            </div>

        </section>
    </main>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Configuración del observador de pantalla
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    // Si el elemento entra en el campo de visión del usuario
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        // Deja de observar el elemento una vez que ya apareció
                        observer.unobserve(entry.target); 
                    }
                });
            }, { 
                threshold: 0.15, // Se activa cuando el 15% del elemento es visible
                rootMargin: "0px 0px -50px 0px" // Margen inferior para activar la animación antes de que toque el borde
            });

            // Seleccionamos las tarjetas de categorías y el bloque de contacto
            const elementosAAnimar = document.querySelectorAll('.category, .section-contact');

            // Le asignamos la clase base de CSS y empezamos a observarlos
            elementosAAnimar.forEach(el => {
                el.classList.add('fade-in-element');
                observer.observe(el);
            });
        });
    </script>

</body>
</html>
